name: Synthetic platform diagnosis
on:
  push:
    branches: ['codex/source-review-ci-probe-20261001']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: df4e6421c5075cb76bb3be59a1127136c8497892
          fetch-depth: 1
          persist-credentials: false
      - name: Trace only synthetic verifier fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-release-artifact.sh')
          s=p.read_text().replace('profile_expiration_is_future() {','profile_expiration_is_future() {\n  set -x').replace('signing_certificate_matches_profile() {','signing_certificate_matches_profile() {\n  set -x').replace('validate_provisioning_profile() {','validate_provisioning_profile() {\n  set -x')
          p.write_text(s)
          p=Path('scripts/test-release-artifact-verifier.sh')
          p.write_text(p.read_text().replace('plutil -p "$LAST_REPORT"','jq . "$LAST_REPORT"'))
          PY
          zsh scripts/test-release-artifact-verifier.sh
